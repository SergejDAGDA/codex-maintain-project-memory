interface:
  display_name: "Maintain Project Memory"
  short_description: "Initialize, adopt, and keep project memory current"
  default_prompt: "Use $maintain-project-memory at the start or resumption of substantial project work. First verify installed skill freshness against canonical main when current-canonical behavior matters; in network-restricted environments use the documented recorded-install provenance fallback. Then bootstrap/adopt project memory, run freshness checks, record checkpoints, audit drift, or prepare a handoff. During adoption, treat `ADOPTION status_history=likely-accumulation` as a lifecycle cleanup/review requirement rather than marker-only adoption and follow `references/status-history-adoption.md`; the audit remains read-only. In existing projects, first check project-local AGENTS.md WIP routing through read-only adoption; if missing, pause ordinary substantive coding for separately approved adoption. Treat broad defer-memory requests as ambiguous until the user explicitly permits a factual WIP record. For substantial unfinished write-capable work, preserve a minimum factual WIP continuity record in STATUS.md before material edits and at meaningful slice/blocker/pause boundaries, following the project's write policy; explicit no-tracking-write and strict approval constraints remain authoritative. At every substantial task closeout, evaluate whether a meaningful verified Checkpoint trigger occurred; complete permitted canonical STATUS.md and SESSION_LOG.md updates before reporting durable completion, or report Checkpoint: PENDING with the reason when writes are prohibited or blocked. Distinguish read-only target operations from task-wide no-memory-write instructions. Before claiming Checkpoint: COMPLETE, reconcile task-relevant current claims across PROJECT.md, STATUS.md, DECISIONS.md and historical SESSION_LOG.md without rewriting past entries; clearly label historical RED checks and never infer Approved intent from tests or source documentation. Report Checkpoint: PENDING when an unresolved material contradiction remains. On verified completed write stages, follow the project-local Local Git commit policy separately from memory update policy: finish affected docs and factual memory first, then narrow native local commit under the safety gates, never push or publish."
