interface:
  display_name: "Maintain Project Memory"
  short_description: "Initialize, adopt, and keep project memory current"
  default_prompt: "Use $maintain-project-memory at the start or resumption of substantial project work. First verify installed skill freshness against canonical main when current-canonical behavior matters; in network-restricted environments use the documented recorded-install provenance fallback. Then bootstrap/adopt project memory, run freshness checks, record checkpoints, audit drift, or prepare a handoff. During adoption, treat `ADOPTION status_history=likely-accumulation` as a lifecycle cleanup/review requirement rather than marker-only adoption and follow `references/status-history-adoption.md`; the audit remains read-only."
