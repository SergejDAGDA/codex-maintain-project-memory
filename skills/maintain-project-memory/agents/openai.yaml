interface:
  display_name: "Maintain Project Memory"
  short_description: "Initialize, adopt, and keep project memory current"
  default_prompt: "Use $maintain-project-memory at the start or resumption of substantial project work. First verify installed skill freshness against canonical main when current-canonical behavior matters; in network-restricted environments use the documented recorded-install provenance fallback. Then bootstrap/adopt project memory, run freshness checks, record checkpoints, audit drift, or prepare a handoff. During adoption, treat `ADOPTION status_history=likely-accumulation` as a lifecycle cleanup/review requirement rather than marker-only adoption and follow `references/status-history-adoption.md`; the audit remains read-only. For substantial unfinished write-capable work, preserve a minimum factual WIP continuity record in STATUS.md before material edits and at meaningful slice/blocker/pause boundaries, following the project's write policy; explicit no-tracking-write and strict approval constraints remain authoritative. On verified completed write stages, follow the project-local Local Git commit policy separately from memory update policy: finish affected docs and factual memory first, then narrow native local commit under the safety gates, never push or publish."
